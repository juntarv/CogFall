<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>CogFall — Gameplay</title>
<style>
:root{
  --bg:#0C2529;--surface:#123138;--surface2:#17414A;--teal:#1C6E74;
  --brass:#F2A93B;--brass-hi:#FFCE7A;--brass-deep:#B9761E;--power:#FFD27A;--rust:#C4502E;
  --text:#F4E9D6;--text2:#93B2B6;--text3:#5E7B80;--hair:rgba(244,233,214,.10);
  --ff-display:"Futura","Century Gothic","Avenir Next",sans-serif;
  --ff-body:"Avenir Next","Avenir",-apple-system,sans-serif;
  --ff-plate:"Copperplate","Copperplate Gothic Bold","Futura",serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:390px;height:844px}
body{font-family:var(--ff-body);color:var(--text);background:var(--bg);overflow:hidden;-webkit-font-smoothing:antialiased}
.screen{position:relative;width:390px;height:844px;overflow:hidden}
.bg{position:absolute;inset:0;background:radial-gradient(120% 60% at 50% 30%,#163f46 0%,#0c2a2f 52%,#07161a 100%)}
.grain{position:absolute;inset:0;opacity:.05;mix-blend-mode:overlay;background-image:radial-gradient(rgba(255,255,255,.7) .5px,transparent .6px);background-size:3px 3px}
.vig{position:absolute;inset:0;box-shadow:inset 0 0 150px 30px rgba(0,0,0,.55);pointer-events:none}
.gear{position:absolute;display:block}
.eyebrow{font-family:var(--ff-plate);text-transform:uppercase;letter-spacing:.2em;font-weight:700}

/* ---------- HUD ---------- */
.hud{position:absolute;top:16px;left:16px;right:16px;height:56px;display:flex;align-items:center;gap:10px;z-index:5}
.chip{padding:8px 12px;border-radius:14px;background:linear-gradient(180deg,rgba(23,65,74,.9),rgba(11,34,38,.94));border:1px solid var(--hair);box-shadow:0 6px 14px rgba(0,0,0,.4);display:flex;flex-direction:column;line-height:1.05}
.chip .k{font-family:var(--ff-plate);text-transform:uppercase;letter-spacing:.16em;font-size:9px;color:var(--text3);font-weight:700}
.chip .v{font-family:var(--ff-display);font-weight:800;font-size:16px;color:var(--text)}
.score{margin:0 auto;text-align:center}
.score .n{font-family:var(--ff-display);font-weight:800;font-size:30px;letter-spacing:.02em;color:var(--text);text-shadow:0 2px 4px rgba(0,0,0,.5)}
.score .m{font-family:var(--ff-plate);text-transform:uppercase;letter-spacing:.18em;font-size:10px;color:var(--brass);font-weight:700}
.heat{width:56px}
.heatbar{height:8px;border-radius:99px;background:rgba(244,233,214,.12);overflow:hidden;margin-top:3px;border:1px solid rgba(196,80,46,.35)}
.heatbar i{display:block;width:38%;height:100%;background:linear-gradient(90deg,#F2A93B,#C4502E)}
.pause{width:46px;height:46px;flex:none;border-radius:14px;background:linear-gradient(180deg,rgba(23,65,74,.92),rgba(11,34,38,.95));border:1px solid rgba(242,169,59,.4);display:grid;place-items:center;box-shadow:0 6px 14px rgba(0,0,0,.4)}
.pause b{width:4px;height:16px;background:#FFCE7A;border-radius:2px;box-shadow:8px 0 0 #FFCE7A}

/* ---------- BAY ---------- */
.bay{position:absolute;left:16px;right:16px;top:84px;bottom:172px;border-radius:24px;overflow:hidden;
  background:linear-gradient(180deg,#0f353c 0%,#0a2126 100%);
  border:1px solid rgba(242,169,59,.16);box-shadow:inset 0 3px 10px rgba(0,0,0,.5),0 20px 40px rgba(0,0,0,.5)}
.rail{position:absolute;top:0;bottom:0;width:14px;background:linear-gradient(90deg,#2a5158,#12363c);border-right:1px solid rgba(0,0,0,.4)}
.rail.l{left:0}.rail.r{right:0;border-right:none;border-left:1px solid rgba(0,0,0,.4);background:linear-gradient(270deg,#2a5158,#12363c)}
.bolt{position:absolute;width:8px;height:8px;border-radius:50%;background:radial-gradient(circle at 40% 32%,#FFCE7A,#7A4B12);box-shadow:inset 0 0 0 1px rgba(0,0,0,.4)}
.grid{position:absolute;inset:14px 14px;background-image:linear-gradient(rgba(242,169,59,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(242,169,59,.05) 1px,transparent 1px);background-size:34px 34px;opacity:.6}
.axle{position:absolute;width:10px;height:10px;border-radius:50%;background:radial-gradient(circle,#0a2126,#040c0e);border:1.5px solid rgba(147,178,182,.4)}
.spindle{position:absolute;width:12px;height:12px;border-radius:50%;background:#FFD27A;box-shadow:0 0 0 4px rgba(255,210,122,.22),0 0 26px 8px rgba(255,210,122,.5)}
/* aim guide */
.guide{position:absolute;top:0;bottom:0;width:88px;left:150px;background:linear-gradient(180deg,rgba(255,206,122,.14),rgba(255,206,122,0) 70%);border-left:1px dashed rgba(255,206,122,.4);border-right:1px dashed rgba(255,206,122,.4)}
.arrow{position:absolute;top:8px;left:180px;transform:translateX(-50%)}
/* target lamp */
.lamp{position:absolute;right:26px;top:34px;display:flex;flex-direction:column;align-items:center;gap:5px}
.bulb{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 40% 34%,#FFF0C6,#F2A93B 60%,#8A5410);box-shadow:0 0 22px 6px rgba(255,210,122,.55),inset 0 -3px 6px rgba(122,75,18,.6)}
.lamp .t{font-family:var(--ff-plate);text-transform:uppercase;letter-spacing:.12em;font-size:9px;color:var(--power);font-weight:700}
.chip-mini{position:absolute;padding:4px 9px;border-radius:99px;background:rgba(8,20,23,.82);border:1px solid rgba(242,169,59,.3);font-family:var(--ff-plate);text-transform:uppercase;letter-spacing:.14em;font-size:9px;color:var(--brass);font-weight:700}

/* connection glow line between meshed gears */
.link{position:absolute;height:3px;background:linear-gradient(90deg,rgba(255,210,122,.7),rgba(255,210,122,.2));border-radius:2px;box-shadow:0 0 8px rgba(255,210,122,.5)}

/* ---------- QUEUE ---------- */
.tray{position:absolute;left:16px;right:16px;bottom:36px;height:120px;border-radius:22px;
  background:linear-gradient(180deg,rgba(23,65,74,.92),rgba(11,34,38,.95));border:1px solid var(--hair);
  box-shadow:0 -1px 0 rgba(0,0,0,.4),0 16px 30px rgba(0,0,0,.5);display:flex;align-items:center;padding:0 18px;gap:14px}
.now{display:flex;flex-direction:column;align-items:center;gap:6px;width:104px}
.now-disc{position:relative;width:80px;height:80px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 40% 32%,#1d5058,#0e2c31);border:2px solid rgba(242,169,59,.6);
  box-shadow:0 0 22px rgba(242,169,59,.35),inset 0 -6px 12px rgba(0,0,0,.35)}
.now .cap{font-family:var(--ff-plate);text-transform:uppercase;letter-spacing:.18em;font-size:9px;color:var(--brass);font-weight:700}
.qdiv{width:1px;height:74px;background:var(--hair)}
.next{flex:1;display:flex;flex-direction:column;gap:6px}
.next .k{font-family:var(--ff-plate);text-transform:uppercase;letter-spacing:.2em;font-size:10px;color:var(--text3);font-weight:700}
.qrow{display:flex;align-items:center;gap:14px}
.slot{width:46px;height:46px;border-radius:12px;background:rgba(8,20,23,.5);border:1px solid var(--hair);display:grid;place-items:center}
.hintbtn{margin-left:auto;padding:12px 16px;border-radius:16px;background:linear-gradient(180deg,#FFDC8E,#F2A93B 45%,#C9861F);border:1px solid #7A4B12;box-shadow:0 8px 18px rgba(242,169,59,.35),inset 0 2px 0 rgba(255,255,255,.5);text-align:center}
.hintbtn .t{font-family:var(--ff-display);font-weight:800;font-size:14px;color:#3A2408;letter-spacing:.06em;text-transform:uppercase}
</style>
</head>
<body>
<div class="screen">
  <div class="bg"></div>
  <svg width="0" height="0" aria-hidden="true"><defs>
    <radialGradient id="gBrass" cx="36%" cy="30%" r="80%"><stop offset="0" stop-color="#FFE7B4"/><stop offset=".40" stop-color="#F2A93B"/><stop offset=".78" stop-color="#B9761E"/><stop offset="1" stop-color="#6E430E"/></radialGradient>
    <radialGradient id="gSteel" cx="36%" cy="30%" r="80%"><stop offset="0" stop-color="#D4E8EA"/><stop offset=".5" stop-color="#7C9EA3"/><stop offset="1" stop-color="#274A50"/></radialGradient>
    <radialGradient id="gDark" cx="36%" cy="30%" r="80%"><stop offset="0" stop-color="#255057"/><stop offset="1" stop-color="#0C282D"/></radialGradient>
    <radialGradient id="gGhost" cx="36%" cy="30%" r="80%"><stop offset="0" stop-color="#FFE7B4"/><stop offset="1" stop-color="#B9761E"/></radialGradient>
    <symbol id="cog" viewBox="0 0 120 120">
      <g><rect x="52.5" y="2" width="15" height="26" rx="3" transform="rotate(0 60 60)"/><rect x="52.5" y="2" width="15" height="26" rx="3" transform="rotate(30 60 60)"/><rect x="52.5" y="2" width="15" height="26" rx="3" transform="rotate(60 60 60)"/><rect x="52.5" y="2" width="15" height="26" rx="3" transform="rotate(90 60 60)"/><rect x="52.5" y="2" width="15" height="26" rx="3" transform="rotate(120 60 60)"/><rect x="52.5" y="2" width="15" height="26" rx="3" transform="rotate(150 60 60)"/><rect x="52.5" y="2" width="15" height="26" rx="3" transform="rotate(180 60 60)"/><rect x="52.5" y="2" width="15" height="26" rx="3" transform="rotate(210 60 60)"/><rect x="52.5" y="2" width="15" height="26" rx="3" transform="rotate(240 60 60)"/><rect x="52.5" y="2" width="15" height="26" rx="3" transform="rotate(270 60 60)"/><rect x="52.5" y="2" width="15" height="26" rx="3" transform="rotate(300 60 60)"/><rect x="52.5" y="2" width="15" height="26" rx="3" transform="rotate(330 60 60)"/><circle cx="60" cy="60" r="43"/></g>
      <circle cx="60" cy="60" r="31" fill="none" stroke="rgba(0,0,0,.16)" stroke-width="2"/>
      <g stroke="rgba(0,0,0,.2)" stroke-width="7" stroke-linecap="round" fill="none"><line x1="60" y1="24" x2="60" y2="96"/><line x1="24" y1="60" x2="96" y2="60"/><line x1="35" y1="35" x2="85" y2="85"/><line x1="85" y1="35" x2="35" y2="85"/></g>
      <circle cx="60" cy="60" r="16" fill="#0C2529"/><circle cx="60" cy="60" r="16" fill="none" stroke="rgba(0,0,0,.5)" stroke-width="2"/>
    </symbol>
  </defs></svg>

  <!-- HUD -->
  <div class="hud">
    <div class="chip"><span class="k">Bay</span><span class="v">07</span></div>
    <div class="score"><div class="n">6,240</div><div class="m">×2.4 spin</div></div>
    <div class="heat"><div class="eyebrow" style="font-size:9px;color:#C4502E;text-align:right">Heat</div><div class="heatbar"><i></i></div></div>
    <div class="pause"><b></b></div>
  </div>

  <!-- BAY -->
  <div class="bay">
    <div class="grid"></div>
    <div class="guide"></div>
    <div class="rail l"></div><div class="rail r"></div>
    <div class="bolt" style="left:3px;top:14px"></div><div class="bolt" style="left:3px;bottom:14px"></div>
    <div class="bolt" style="right:3px;top:14px"></div><div class="bolt" style="right:3px;bottom:14px"></div>

    <!-- aim arrow -->
    <svg class="arrow" width="26" height="20" viewBox="0 0 26 20"><path d="M13 20L3 4h20z" fill="rgba(255,206,122,.85)"/></svg>
    <div class="chip-mini" style="left:150px;top:40px;color:#93B2B6;border-color:rgba(147,178,182,.3)">Aim &amp; drop</div>

    <!-- axles (empty mount points) -->
    <div class="axle" style="left:60px;top:120px"></div>
    <div class="axle" style="left:250px;top:150px"></div>
    <div class="axle" style="left:96px;top:300px"></div>

    <!-- meshed train (bottom-left power spindle → up-right target lamp) -->
    <svg class="gear" style="left:24px;top:250px;width:96px;height:96px;filter:drop-shadow(0 0 22px rgba(255,210,122,.6)) drop-shadow(0 6px 8px rgba(0,0,0,.5))" viewBox="0 0 120 120"><use href="#cog" fill="url(#gBrass)"/></svg>
    <div class="spindle" style="left:66px;top:292px"></div>
    <div class="chip-mini" style="left:20px;top:352px;color:#FFD27A;border-color:rgba(255,210,122,.4)">Power spindle</div>

    <svg class="gear" style="left:96px;top:206px;width:80px;height:80px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.5))" viewBox="0 0 120 120"><use href="#cog" fill="url(#gSteel)"/></svg>
    <svg class="gear" style="left:158px;top:168px;width:74px;height:74px;filter:drop-shadow(0 0 14px rgba(255,210,122,.4)) drop-shadow(0 6px 8px rgba(0,0,0,.5))" viewBox="0 0 120 120"><use href="#cog" fill="url(#gBrass)"/></svg>
    <svg class="gear" style="left:212px;top:132px;width:66px;height:66px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.5))" viewBox="0 0 120 120"><use href="#cog" fill="url(#gSteel)"/></svg>

    <!-- glow links -->
    <div class="link" style="left:96px;top:296px;width:22px;transform:rotate(-32deg)"></div>
    <div class="link" style="left:150px;top:236px;width:22px;transform:rotate(-30deg)"></div>
    <div class="link" style="left:206px;top:190px;width:20px;transform:rotate(-30deg)"></div>

    <!-- falling gear (ghost) in the aim column -->
    <svg class="gear" style="left:158px;top:24px;width:60px;height:60px;opacity:.6;filter:drop-shadow(0 0 12px rgba(255,206,122,.5))" viewBox="0 0 120 120"><use href="#cog" fill="url(#gGhost)"/></svg>

    <!-- target lamp -->
    <div class="lamp"><div class="bulb"></div><div class="t">Powered</div></div>
  </div>

  <!-- QUEUE / TRAY -->
  <div class="tray">
    <div class="now">
      <div class="now-disc"><svg width="58" height="58" viewBox="0 0 120 120"><use href="#cog" fill="url(#gBrass)"/></svg></div>
      <div class="cap">In hand · L</div>
    </div>
    <div class="qdiv"></div>
    <div class="next">
      <div class="k">Next up</div>
      <div class="qrow">
        <div class="slot"><svg width="30" height="30" viewBox="0 0 120 120"><use href="#cog" fill="url(#gSteel)"/></svg></div>
        <div class="slot"><svg width="38" height="38" viewBox="0 0 120 120"><use href="#cog" fill="url(#gBrass)"/></svg></div>
        <div class="slot"><svg width="24" height="24" viewBox="0 0 120 120"><use href="#cog" fill="url(#gSteel)"/></svg></div>
        <div class="hintbtn"><div class="t">Drop</div></div>
      </div>
    </div>
  </div>

  <div class="grain"></div><div class="vig"></div>
</div>
</body>
</html>
