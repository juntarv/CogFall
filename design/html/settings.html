<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>CogFall — Settings</title>
<style>
:root{
  --bg:#0C2529;--surface:#123138;--surface2:#17414A;--teal:#1C6E74;
  --brass:#F2A93B;--brass-hi:#FFCE7A;--brass-deep:#B9761E;--power:#FFD27A;--rust:#C4502E;
  --text:#F4E9D6;--text2:#93B2B6;--text3:#5E7B80;--hair:rgba(244,233,214,.10);
  --ff-display:"Futura","Century Gothic","Avenir Next",sans-serif;
  --ff-body:"Avenir Next","Avenir",-apple-system,sans-serif;
  --ff-plate:"Copperplate","Copperplate Gothic Bold","Futura",serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:390px;height:844px}
body{font-family:var(--ff-body);color:var(--text);background:var(--bg);overflow:hidden;-webkit-font-smoothing:antialiased}
.screen{position:relative;width:390px;height:844px;overflow:hidden}
.bg{position:absolute;inset:0;background:radial-gradient(120% 70% at 50% -6%,#1c4a51 0%,#0f2e33 46%,#07161a 100%)}
.grain{position:absolute;inset:0;opacity:.05;mix-blend-mode:overlay;background-image:radial-gradient(rgba(255,255,255,.7) .5px,transparent .6px);background-size:3px 3px}
.vig{position:absolute;inset:0;box-shadow:inset 0 0 160px 34px rgba(0,0,0,.6);pointer-events:none}
.gear{position:absolute;display:block}
.eyebrow{font-family:var(--ff-plate);text-transform:uppercase;letter-spacing:.26em;font-size:12px;color:var(--brass);font-weight:700}

.top{position:absolute;top:20px;left:20px;right:20px;display:flex;align-items:center;gap:14px}
.back{width:46px;height:46px;flex:none;border-radius:50%;background:radial-gradient(circle at 38% 30%,#1d4c53,#0d2a2f 72%);border:1.5px solid rgba(242,169,59,.5);display:grid;place-items:center;box-shadow:0 8px 18px rgba(0,0,0,.5)}
.back svg{stroke:#FFCE7A;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.ttl .h{font-family:var(--ff-display);font-weight:800;font-size:26px}

.panel{position:absolute;top:112px;left:20px;right:20px;border-radius:24px;padding:6px 20px;
  background:linear-gradient(180deg,rgba(23,65,74,.62),rgba(11,32,36,.82));border:1px solid var(--hair);box-shadow:0 18px 38px rgba(0,0,0,.5)}
.item{display:flex;align-items:center;gap:16px;padding:22px 0}
.item + .item{border-top:1px solid var(--hair)}
.ic{width:48px;height:48px;flex:none;border-radius:14px;display:grid;place-items:center;background:radial-gradient(circle at 38% 30%,#1d5058,#0e2c31);border:1px solid rgba(242,169,59,.3)}
.ic svg{stroke:#FFCE7A;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round}
.meta{display:flex;flex-direction:column;line-height:1.15}
.meta .name{font-family:var(--ff-display);font-weight:800;font-size:18px;color:var(--text)}
.meta .desc{font-size:12px;color:var(--text2);margin-top:2px}
/* toggle */
.tog{margin-left:auto;width:60px;height:34px;border-radius:99px;position:relative;flex:none}
.tog.on{background:linear-gradient(90deg,#C9861F,#F2A93B);box-shadow:inset 0 1px 3px rgba(0,0,0,.4),0 0 16px rgba(242,169,59,.4)}
.tog.off{background:rgba(8,20,23,.7);border:1px solid var(--hair)}
.tog .knob{position:absolute;top:3px;width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 38% 32%,#FFF3D6,#E9C486);box-shadow:0 2px 5px rgba(0,0,0,.5)}
.tog.on .knob{right:3px}
.tog.off .knob{left:3px;background:radial-gradient(circle at 38% 32%,#7C9EA3,#3c5c61)}

/* reset (destructive) */
.reset{margin-left:auto;padding:12px 18px;border-radius:14px;background:rgba(66,26,16,.55);border:1px solid rgba(196,80,46,.5);display:flex;align-items:center;gap:9px}
.reset .lb{font-family:var(--ff-plate);text-transform:uppercase;letter-spacing:.12em;font-size:12px;font-weight:700;color:#FFB98C}
.reset svg{stroke:#FFB98C;stroke-width:2;fill:none;stroke-linecap:round}
.item.danger .ic{border-color:rgba(196,80,46,.5);background:radial-gradient(circle at 38% 30%,#5a251a,#2a0f0a)}
.item.danger .ic svg{stroke:#FFB98C}
.item.danger .meta .name{color:#FFB98C}

/* version footer */
.ver{position:absolute;bottom:44px;left:0;right:0;text-align:center}
.ver .mark{width:44px;height:44px;margin:0 auto 8px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.5))}
.ver .k{font-family:var(--ff-plate);text-transform:uppercase;letter-spacing:.24em;font-size:11px;color:var(--text3);font-weight:700}
.ver .v{font-family:var(--ff-display);font-weight:800;font-size:15px;color:var(--text2);margin-top:3px;letter-spacing:.06em}
</style>
</head>
<body>
<div class="screen">
  <div class="bg"></div>
  <svg width="0" height="0" aria-hidden="true"><defs>
    <radialGradient id="gBrass" cx="36%" cy="30%" r="80%"><stop offset="0" stop-color="#FFE7B4"/><stop offset=".40" stop-color="#F2A93B"/><stop offset=".78" stop-color="#B9761E"/><stop offset="1" stop-color="#6E430E"/></radialGradient>
    <radialGradient id="gDark" cx="36%" cy="30%" r="80%"><stop offset="0" stop-color="#255057"/><stop offset="1" stop-color="#0C282D"/></radialGradient>
    <symbol id="cog" viewBox="0 0 120 120">
      <g><rect x="52.5" y="2" width="15" height="26" rx="3" transform="rotate(0 60 60)"/><rect x="52.5" y="2" width="15" height="26" rx="3" transform="rotate(30 60 60)"/><rect x="52.5" y="2" width="15" height="26" rx="3" transform="rotate(60 60 60)"/><rect x="52.5" y="2" width="15" height="26" rx="3" transform="rotate(90 60 60)"/><rect x="52.5" y="2" width="15" height="26" rx="3" transform="rotate(120 60 60)"/><rect x="52.5" y="2" width="15" height="26" rx="3" transform="rotate(150 60 60)"/><rect x="52.5" y="2" width="15" height="26" rx="3" transform="rotate(180 60 60)"/><rect x="52.5" y="2" width="15" height="26" rx="3" transform="rotate(210 60 60)"/><rect x="52.5" y="2" width="15" height="26" rx="3" transform="rotate(240 60 60)"/><rect x="52.5" y="2" width="15" height="26" rx="3" transform="rotate(270 60 60)"/><rect x="52.5" y="2" width="15" height="26" rx="3" transform="rotate(300 60 60)"/><rect x="52.5" y="2" width="15" height="26" rx="3" transform="rotate(330 60 60)"/><circle cx="60" cy="60" r="43"/></g>
      <g stroke="rgba(0,0,0,.2)" stroke-width="7" stroke-linecap="round" fill="none"><line x1="60" y1="24" x2="60" y2="96"/><line x1="24" y1="60" x2="96" y2="60"/><line x1="35" y1="35" x2="85" y2="85"/><line x1="85" y1="35" x2="35" y2="85"/></g>
      <circle cx="60" cy="60" r="16" fill="#0C2529"/><circle cx="60" cy="60" r="16" fill="none" stroke="rgba(0,0,0,.5)" stroke-width="2"/>
    </symbol>
  </defs></svg>

  <svg class="gear" style="bottom:120px;right:-60px;width:180px;height:180px;opacity:.1" viewBox="0 0 120 120"><use href="#cog" fill="url(#gDark)"/></svg>

  <div class="top">
    <div class="back"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></div>
    <div class="ttl"><div class="eyebrow">The workbench</div><div class="h">Settings</div></div>
  </div>

  <div class="panel">
    <!-- 1 Animation intensity -->
    <div class="item">
      <div class="ic"><svg width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M6 6l2 2M16 16l2 2M18 6l-2 2M8 16l-2 2"/></svg></div>
      <div class="meta"><span class="name">Animation Intensity</span><span class="desc">Drifting gears, glow &amp; particle juice</span></div>
      <div class="tog on"><span class="knob"></span></div>
    </div>
    <!-- 2 Haptics -->
    <div class="item">
      <div class="ic"><svg width="24" height="24" viewBox="0 0 24 24"><rect x="8" y="3" width="8" height="18" rx="2"/><path d="M4 9v6M20 9v6"/></svg></div>
      <div class="meta"><span class="name">Haptics</span><span class="desc">Taptic feedback on mesh, drop &amp; jam</span></div>
      <div class="tog on"><span class="knob"></span></div>
    </div>
    <!-- 3 Reset progress -->
    <div class="item danger">
      <div class="ic"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 1 3 6"/><path d="M4 12V7m0 5h5"/></svg></div>
      <div class="meta"><span class="name">Reset Progress</span><span class="desc">Wipe bays, marques &amp; scores</span></div>
      <div class="reset"><svg width="16" height="16" viewBox="0 0 24 24"><path d="M6 7h12M9 7V5h6v2M8 7l1 12h6l1-12"/></svg><span class="lb">Reset</span></div>
    </div>
  </div>

  <div class="ver">
    <svg class="mark gear" viewBox="0 0 120 120"><use href="#cog" fill="url(#gBrass)"/></svg>
    <div class="k">CogFall</div>
    <div class="v">Version 1.0.0</div>
  </div>

  <div class="grain"></div><div class="vig"></div>
</div>
</body>
</html>
