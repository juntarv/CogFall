<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>CogFall — Onboarding</title>
<style>
:root{
  --bg:#0C2529;--surface:#123138;--surface2:#17414A;--teal:#1C6E74;
  --brass:#F2A93B;--brass-hi:#FFCE7A;--brass-deep:#B9761E;--power:#FFD27A;
  --text:#F4E9D6;--text2:#93B2B6;--text3:#5E7B80;--hair:rgba(244,233,214,.10);
  --ff-display:"Futura","Century Gothic","Avenir Next",sans-serif;
  --ff-body:"Avenir Next","Avenir",-apple-system,sans-serif;
  --ff-plate:"Copperplate","Copperplate Gothic Bold","Futura",serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:390px;height:844px}
body{font-family:var(--ff-body);color:var(--text);background:var(--bg);overflow:hidden;-webkit-font-smoothing:antialiased}
.screen{position:relative;width:390px;height:844px;overflow:hidden}
.bg{position:absolute;inset:0;background:radial-gradient(120% 72% at 50% 8%,#1e535a 0%,#103035 46%,#07161a 100%)}
.grain{position:absolute;inset:0;opacity:.05;mix-blend-mode:overlay;background-image:radial-gradient(rgba(255,255,255,.7) .5px,transparent .6px);background-size:3px 3px}
.vig{position:absolute;inset:0;box-shadow:inset 0 0 170px 36px rgba(0,0,0,.6);pointer-events:none}
.gear{position:absolute;display:block}
.skip{position:absolute;top:22px;right:24px;font-family:var(--ff-plate);text-transform:uppercase;letter-spacing:.2em;font-size:11px;color:var(--text2);font-weight:700}

/* hero stage */
.stage{position:absolute;top:70px;left:24px;right:24px;height:392px;border-radius:26px;overflow:hidden;
  background:linear-gradient(180deg,#0f353c 0%,#0b2429 100%);
  border:1px solid var(--hair);box-shadow:inset 0 2px 0 rgba(255,255,255,.05),0 20px 40px rgba(0,0,0,.5)}
.stage .floor{position:absolute;left:20px;right:20px;bottom:26px;height:120px;border-radius:14px;background:linear-gradient(180deg,#0c2c31,#08181b);border:1px solid rgba(242,169,59,.18)}
.spindle{position:absolute;width:9px;height:9px;border-radius:50%;background:#FFD27A;box-shadow:0 0 0 4px rgba(255,210,122,.25),0 0 22px 6px rgba(255,210,122,.5)}
.traj{position:absolute;left:0;top:0}
.label-chip{position:absolute;padding:5px 11px;border-radius:99px;background:rgba(8,20,23,.78);border:1px solid rgba(242,169,59,.3);font-family:var(--ff-plate);text-transform:uppercase;letter-spacing:.16em;font-size:10px;color:var(--brass);font-weight:700}

/* copy card */
.copy{position:absolute;top:486px;left:24px;right:24px;padding:22px 22px 24px;border-radius:22px;
  background:linear-gradient(180deg,rgba(23,65,74,.55),rgba(12,37,41,.72));border:1px solid var(--hair);
  box-shadow:0 16px 34px rgba(0,0,0,.45);backdrop-filter:blur(3px)}
.eyebrow{font-family:var(--ff-plate);text-transform:uppercase;letter-spacing:.28em;font-size:12px;color:var(--brass);font-weight:700}
.h{font-family:var(--ff-display);font-weight:800;font-size:32px;line-height:1.02;letter-spacing:-.01em;margin:12px 0 10px}
.h em{font-style:normal;color:var(--brass)}
.p{font-size:15px;line-height:1.5;color:var(--text2);font-weight:400}

/* progress + cta */
.dots{position:absolute;bottom:132px;left:0;right:0;display:flex;gap:8px;justify-content:center}
.dots i{width:8px;height:8px;border-radius:99px;background:rgba(244,233,214,.22)}
.dots i.on{width:26px;background:linear-gradient(90deg,#F2A93B,#FFCE7A)}
.cta{position:absolute;left:24px;right:24px;bottom:44px;height:64px;border-radius:20px;
  background:linear-gradient(180deg,#FFDC8E 0%,#F2A93B 42%,#C9861F 100%);border:1px solid #7A4B12;
  box-shadow:0 12px 26px rgba(242,169,59,.38),0 3px 7px rgba(0,0,0,.5),inset 0 2px 0 rgba(255,255,255,.6),inset 0 -7px 14px rgba(122,75,18,.55);
  display:flex;align-items:center;justify-content:center;gap:12px}
.cta span{font-family:var(--ff-display);font-weight:800;font-size:20px;color:#3A2408;letter-spacing:.08em;text-transform:uppercase;text-shadow:0 1px 0 rgba(255,255,255,.4)}
.cta svg{stroke:#3A2408;stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>
<div class="screen">
  <div class="bg"></div>
  <svg width="0" height="0" aria-hidden="true"><defs>
    <radialGradient id="gBrass" cx="36%" cy="30%" r="80%"><stop offset="0" stop-color="#FFE7B4"/><stop offset=".40" stop-color="#F2A93B"/><stop offset=".78" stop-color="#B9761E"/><stop offset="1" stop-color="#6E430E"/></radialGradient>
    <radialGradient id="gSteel" cx="36%" cy="30%" r="80%"><stop offset="0" stop-color="#D4E8EA"/><stop offset=".5" stop-color="#7C9EA3"/><stop offset="1" stop-color="#274A50"/></radialGradient>
    <radialGradient id="gDark" cx="36%" cy="30%" r="80%"><stop offset="0" stop-color="#255057"/><stop offset="1" stop-color="#0C282D"/></radialGradient>
    <radialGradient id="gGhost" cx="36%" cy="30%" r="80%"><stop offset="0" stop-color="#FFE7B4"/><stop offset="1" stop-color="#B9761E"/></radialGradient>
    <symbol id="cog" viewBox="0 0 120 120">
      <g><rect x="52.5" y="2" width="15" height="26" rx="3" transform="rotate(0 60 60)"/><rect x="52.5" y="2" width="15" height="26" rx="3" transform="rotate(30 60 60)"/><rect x="52.5" y="2" width="15" height="26" rx="3" transform="rotate(60 60 60)"/><rect x="52.5" y="2" width="15" height="26" rx="3" transform="rotate(90 60 60)"/><rect x="52.5" y="2" width="15" height="26" rx="3" transform="rotate(120 60 60)"/><rect x="52.5" y="2" width="15" height="26" rx="3" transform="rotate(150 60 60)"/><rect x="52.5" y="2" width="15" height="26" rx="3" transform="rotate(180 60 60)"/><rect x="52.5" y="2" width="15" height="26" rx="3" transform="rotate(210 60 60)"/><rect x="52.5" y="2" width="15" height="26" rx="3" transform="rotate(240 60 60)"/><rect x="52.5" y="2" width="15" height="26" rx="3" transform="rotate(270 60 60)"/><rect x="52.5" y="2" width="15" height="26" rx="3" transform="rotate(300 60 60)"/><rect x="52.5" y="2" width="15" height="26" rx="3" transform="rotate(330 60 60)"/><circle cx="60" cy="60" r="43"/></g>
      <circle cx="60" cy="60" r="31" fill="none" stroke="rgba(0,0,0,.16)" stroke-width="2"/>
      <g stroke="rgba(0,0,0,.2)" stroke-width="7" stroke-linecap="round" fill="none"><line x1="60" y1="24" x2="60" y2="96"/><line x1="24" y1="60" x2="96" y2="60"/><line x1="35" y1="35" x2="85" y2="85"/><line x1="85" y1="35" x2="35" y2="85"/></g>
      <circle cx="60" cy="60" r="16" fill="#0C2529"/><circle cx="60" cy="60" r="16" fill="none" stroke="rgba(0,0,0,.5)" stroke-width="2"/>
    </symbol>
  </defs></svg>

  <div class="skip">Skip</div>

  <!-- HERO STAGE : drop → mesh → power -->
  <div class="stage">
    <svg class="gear" style="top:-30px;right:-30px;width:120px;height:120px;opacity:.12" viewBox="0 0 120 120"><use href="#cog" fill="url(#gDark)"/></svg>

    <!-- falling gear + dashed trajectory -->
    <svg class="traj" width="342" height="392" viewBox="0 0 342 392">
      <path d="M120 40 Q118 120 150 176" fill="none" stroke="rgba(255,206,122,.55)" stroke-width="2.5" stroke-dasharray="3 8" stroke-linecap="round"/>
      <path d="M150 176 l-8 -6 M150 176 l3 -9" stroke="rgba(255,206,122,.7)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    </svg>
    <svg class="gear" style="top:8px;left:88px;width:66px;height:66px;opacity:.55;filter:drop-shadow(0 0 10px rgba(255,206,122,.4))" viewBox="0 0 120 120"><use href="#cog" fill="url(#gGhost)"/></svg>

    <!-- meshed train on the floor -->
    <svg class="gear" style="left:120px;top:186px;width:92px;height:92px;filter:drop-shadow(0 8px 10px rgba(0,0,0,.5))" viewBox="0 0 120 120"><use href="#cog" fill="url(#gSteel)"/></svg>
    <svg class="gear" style="left:186px;top:214px;width:118px;height:118px;filter:drop-shadow(0 0 24px rgba(255,210,122,.55)) drop-shadow(0 8px 10px rgba(0,0,0,.5))" viewBox="0 0 120 120"><use href="#cog" fill="url(#gBrass)"/></svg>
    <svg class="gear" style="left:70px;top:232px;width:78px;height:78px;filter:drop-shadow(0 8px 10px rgba(0,0,0,.5))" viewBox="0 0 120 120"><use href="#cog" fill="url(#gBrass)"/></svg>

    <div class="spindle" style="left:242px;top:270px"></div>
    <div class="label-chip" style="left:210px;top:340px">Power spindle · live</div>
    <div class="label-chip" style="left:26px;top:30px;color:#93B2B6;border-color:rgba(147,178,182,.3)">Next gear</div>
  </div>

  <!-- COPY -->
  <div class="copy">
    <div class="eyebrow">How it works · 1 of 3</div>
    <div class="h">Drop gears so their teeth <em>bite</em>.</div>
    <div class="p">Aim, then let a gear fall. When it settles beside another with a tooth's reach, they lock and spin as one — building a train from the glowing power spindle.</div>
  </div>

  <div class="dots"><i class="on"></i><i></i><i></i></div>

  <!-- CTA (next_button) -->
  <div class="cta"><span>Next</span><svg width="20" height="20" viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6"/></svg></div>

  <div class="grain"></div><div class="vig"></div>
</div>
</body>
</html>
