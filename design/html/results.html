<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>CogFall — Mechanism Complete</title>
<style>
:root{
  --bg:#0C2529;--surface:#123138;--surface2:#17414A;--teal:#1C6E74;
  --brass:#F2A93B;--brass-hi:#FFCE7A;--brass-deep:#B9761E;--power:#FFD27A;--rust:#C4502E;
  --text:#F4E9D6;--text2:#93B2B6;--text3:#5E7B80;--hair:rgba(244,233,214,.10);
  --ff-display:"Futura","Century Gothic","Avenir Next",sans-serif;
  --ff-body:"Avenir Next","Avenir",-apple-system,sans-serif;
  --ff-plate:"Copperplate","Copperplate Gothic Bold","Futura",serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:390px;height:844px}
body{font-family:var(--ff-body);color:var(--text);background:var(--bg);overflow:hidden;-webkit-font-smoothing:antialiased}
.screen{position:relative;width:390px;height:844px;overflow:hidden}
.bg{position:absolute;inset:0;background:radial-gradient(120% 66% at 50% 16%,#245a60 0%,#103035 46%,#07161a 100%)}
.bg::after{content:"";position:absolute;inset:0;background:radial-gradient(80% 40% at 50% 24%,rgba(255,210,122,.22),transparent 60%)}
.grain{position:absolute;inset:0;opacity:.05;mix-blend-mode:overlay;background-image:radial-gradient(rgba(255,255,255,.7) .5px,transparent .6px);background-size:3px 3px}
.vig{position:absolute;inset:0;box-shadow:inset 0 0 170px 38px rgba(0,0,0,.6);pointer-events:none}
.gear{position:absolute;display:block}
.rays{position:absolute;top:-40px;left:50%;transform:translateX(-50%);width:520px;height:520px;opacity:.16}
.eyebrow{font-family:var(--ff-plate);text-transform:uppercase;letter-spacing:.3em;font-size:12px;color:var(--brass);font-weight:700}

.head{position:absolute;top:70px;left:0;right:0;text-align:center}
.seal{position:relative;width:150px;height:150px;margin:0 auto 6px;display:grid;place-items:center}
.seal .g1{width:150px;height:150px;filter:drop-shadow(0 0 30px rgba(255,210,122,.6))}
.seal .lark{position:absolute;width:60px;height:60px}
.h{font-family:var(--ff-display);font-weight:800;font-size:36px;line-height:1;letter-spacing:.01em;margin-top:14px}
.name{font-size:14px;color:var(--text2);margin-top:6px}
.stars{margin-top:14px;font-size:30px;letter-spacing:8px;color:var(--brass);text-shadow:0 3px 8px rgba(0,0,0,.5)}

/* breakdown card */
.card{position:absolute;left:24px;right:24px;top:430px;padding:20px 22px;border-radius:24px;
  background:linear-gradient(180deg,rgba(23,65,74,.7),rgba(11,32,36,.86));border:1px solid var(--hair);
  box-shadow:0 18px 38px rgba(0,0,0,.5)}
.row{display:flex;align-items:center;padding:9px 0}
.row + .row{border-top:1px solid var(--hair)}
.row .k{font-size:14px;color:var(--text2);display:flex;align-items:center;gap:9px}
.row .k svg{stroke:#F2A93B;stroke-width:2;fill:none}
.row .v{margin-left:auto;font-family:var(--ff-display);font-weight:800;font-size:17px;color:var(--text)}
.row.total .k{color:var(--text);font-family:var(--ff-plate);text-transform:uppercase;letter-spacing:.14em;font-size:12px;font-weight:700}
.row.total .v{font-size:26px;color:var(--brass)}

/* CTAs */
.actions{position:absolute;left:24px;right:24px;bottom:38px;display:flex;flex-direction:column;gap:12px}
.cta{height:64px;border-radius:20px;display:flex;align-items:center;justify-content:center;gap:12px;
  background:linear-gradient(180deg,#FFDC8E,#F2A93B 42%,#C9861F);border:1px solid #7A4B12;
  box-shadow:0 12px 26px rgba(242,169,59,.4),inset 0 2px 0 rgba(255,255,255,.55)}
.cta .lb{font-family:var(--ff-display);font-weight:800;font-size:19px;color:#3A2408;text-transform:uppercase;letter-spacing:.06em}
.cta svg{fill:none;stroke:#3A2408;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.sub-actions{display:flex;gap:12px}
.mini{flex:1;height:54px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:9px;background:rgba(23,65,74,.6);border:1px solid var(--hair)}
.mini .lb{font-family:var(--ff-plate);text-transform:uppercase;letter-spacing:.12em;font-size:12px;font-weight:700;color:var(--text)}
.mini svg{stroke:#FFCE7A;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>
<div class="screen">
  <div class="bg"></div>
  <svg width="0" height="0" aria-hidden="true"><defs>
    <radialGradient id="gBrass" cx="36%" cy="30%" r="80%"><stop offset="0" stop-color="#FFE7B4"/><stop offset=".40" stop-color="#F2A93B"/><stop offset=".78" stop-color="#B9761E"/><stop offset="1" stop-color="#6E430E"/></radialGradient>
    <radialGradient id="gSteel" cx="36%" cy="30%" r="80%"><stop offset="0" stop-color="#D4E8EA"/><stop offset=".5" stop-color="#7C9EA3"/><stop offset="1" stop-color="#274A50"/></radialGradient>
    <radialGradient id="gDark" cx="36%" cy="30%" r="80%"><stop offset="0" stop-color="#255057"/><stop offset="1" stop-color="#0C282D"/></radialGradient>
    <symbol id="cog" viewBox="0 0 120 120">
      <g><rect x="52.5" y="2" width="15" height="26" rx="3" transform="rotate(0 60 60)"/><rect x="52.5" y="2" width="15" height="26" rx="3" transform="rotate(30 60 60)"/><rect x="52.5" y="2" width="15" height="26" rx="3" transform="rotate(60 60 60)"/><rect x="52.5" y="2" width="15" height="26" rx="3" transform="rotate(90 60 60)"/><rect x="52.5" y="2" width="15" height="26" rx="3" transform="rotate(120 60 60)"/><rect x="52.5" y="2" width="15" height="26" rx="3" transform="rotate(150 60 60)"/><rect x="52.5" y="2" width="15" height="26" rx="3" transform="rotate(180 60 60)"/><rect x="52.5" y="2" width="15" height="26" rx="3" transform="rotate(210 60 60)"/><rect x="52.5" y="2" width="15" height="26" rx="3" transform="rotate(240 60 60)"/><rect x="52.5" y="2" width="15" height="26" rx="3" transform="rotate(270 60 60)"/><rect x="52.5" y="2" width="15" height="26" rx="3" transform="rotate(300 60 60)"/><rect x="52.5" y="2" width="15" height="26" rx="3" transform="rotate(330 60 60)"/><circle cx="60" cy="60" r="43"/></g>
      <circle cx="60" cy="60" r="31" fill="none" stroke="rgba(0,0,0,.16)" stroke-width="2"/>
      <g stroke="rgba(0,0,0,.2)" stroke-width="7" stroke-linecap="round" fill="none"><line x1="60" y1="24" x2="60" y2="96"/><line x1="24" y1="60" x2="96" y2="60"/><line x1="35" y1="35" x2="85" y2="85"/><line x1="85" y1="35" x2="35" y2="85"/></g>
      <circle cx="60" cy="60" r="16" fill="#0C2529"/><circle cx="60" cy="60" r="16" fill="none" stroke="rgba(0,0,0,.5)" stroke-width="2"/>
    </symbol>
    <radialGradient id="rays" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#FFD27A"/><stop offset="1" stop-color="transparent"/></radialGradient>
  </defs></svg>

  <svg class="rays" viewBox="0 0 100 100"><g stroke="#FFD27A" stroke-width="1.4">
    <line x1="50" y1="50" x2="50" y2="0"/><line x1="50" y1="50" x2="79" y2="8"/><line x1="50" y1="50" x2="96" y2="35"/><line x1="50" y1="50" x2="96" y2="65"/><line x1="50" y1="50" x2="79" y2="92"/><line x1="50" y1="50" x2="50" y2="100"/><line x1="50" y1="50" x2="21" y2="92"/><line x1="50" y1="50" x2="4" y2="65"/><line x1="50" y1="50" x2="4" y2="35"/><line x1="50" y1="50" x2="21" y2="8"/>
  </g></svg>

  <div class="head">
    <div class="seal">
      <svg class="g1 gear" viewBox="0 0 120 120"><use href="#cog" fill="url(#gBrass)"/></svg>
      <svg class="lark" width="60" height="60" viewBox="0 0 24 24" fill="#3A2408"><path d="M4 14c3 0 5-2 7-2s3 2 6 1c-1 3-4 4-7 4-4 0-6-1-6-3z"/><circle cx="16" cy="10" r="2"/><path d="M18 9l3-2-2 3z"/></svg>
    </div>
    <div class="eyebrow">Bay 07 complete</div>
    <div class="h">Escapement<br>Gate ticks!</div>
    <div class="stars">★★★</div>
  </div>

  <div class="card">
    <div class="row"><span class="k"><svg width="16" height="16" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>Powered for</span><span class="v">1:12</span></div>
    <div class="row"><span class="k"><svg width="16" height="16" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M7 12h10"/></svg>Gears used</span><span class="v">9 / 12</span></div>
    <div class="row"><span class="k"><svg width="16" height="16" viewBox="0 0 24 24"><path d="M13 2L4 14h6l-1 8 9-12h-6z"/></svg>Spare-gear bonus</span><span class="v">+1,800</span></div>
    <div class="row total"><span class="k">Total score</span><span class="v">8,040</span></div>
  </div>

  <div class="actions">
    <div class="cta"><span class="lb">Next bay</span><svg width="22" height="22" viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6"/></svg></div>
    <div class="sub-actions">
      <div class="mini"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 1 2.3 5.6M4 12V7m0 5h5"/></svg><span class="lb">Replay</span></div>
      <div class="mini"><svg width="18" height="18" viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.2"/><circle cx="18" cy="9" r="2.2"/><circle cx="9" cy="18" r="2.2"/><path d="M8 7l8 1.5M16 11l-6 5"/></svg><span class="lb">Conduit</span></div>
    </div>
  </div>

  <div class="grain"></div><div class="vig"></div>
</div>
</body>
</html>
