<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>CogFall — Paused</title>
<style>
:root{
  --bg:#0C2529;--surface:#123138;--surface2:#17414A;--teal:#1C6E74;
  --brass:#F2A93B;--brass-hi:#FFCE7A;--brass-deep:#B9761E;--power:#FFD27A;--rust:#C4502E;
  --text:#F4E9D6;--text2:#93B2B6;--text3:#5E7B80;--hair:rgba(244,233,214,.10);
  --ff-display:"Futura","Century Gothic","Avenir Next",sans-serif;
  --ff-body:"Avenir Next","Avenir",-apple-system,sans-serif;
  --ff-plate:"Copperplate","Copperplate Gothic Bold","Futura",serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:390px;height:844px}
body{font-family:var(--ff-body);color:var(--text);background:var(--bg);overflow:hidden;-webkit-font-smoothing:antialiased}
.screen{position:relative;width:390px;height:844px;overflow:hidden}
.bg{position:absolute;inset:0;background:radial-gradient(120% 60% at 50% 30%,#163f46 0%,#0c2a2f 52%,#07161a 100%)}
.gear{position:absolute;display:block}
/* dimmed bay behind */
.behind{position:absolute;inset:0;filter:blur(2px) saturate(.7);opacity:.5}
.scrim{position:absolute;inset:0;background:radial-gradient(90% 60% at 50% 42%,rgba(6,16,18,.55),rgba(6,16,18,.86));backdrop-filter:blur(2px)}
.grain{position:absolute;inset:0;opacity:.05;mix-blend-mode:overlay;background-image:radial-gradient(rgba(255,255,255,.7) .5px,transparent .6px);background-size:3px 3px}
.vig{position:absolute;inset:0;box-shadow:inset 0 0 170px 40px rgba(0,0,0,.7);pointer-events:none}
.eyebrow{font-family:var(--ff-plate);text-transform:uppercase;letter-spacing:.3em;font-size:12px;color:var(--brass);font-weight:700}

.card{position:absolute;left:28px;right:28px;top:190px;padding:34px 26px 28px;border-radius:28px;
  background:linear-gradient(180deg,rgba(23,65,74,.85),rgba(11,32,36,.94));border:1px solid rgba(242,169,59,.28);
  box-shadow:0 30px 60px rgba(0,0,0,.6),inset 0 2px 0 rgba(255,255,255,.06);text-align:center}
.seal{position:relative;width:120px;height:120px;margin:0 auto 8px;display:grid;place-items:center}
.seal .big{width:120px;height:120px;filter:drop-shadow(0 0 24px rgba(242,169,59,.4))}
.seal .pi{position:absolute;display:flex;gap:7px}
.seal .pi b{width:10px;height:34px;background:#0C2529;border-radius:3px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.5)}
.h{font-family:var(--ff-display);font-weight:800;font-size:40px;letter-spacing:.02em;margin-top:6px}
.sub{font-size:13px;color:var(--text2);margin-top:2px}
.mini{margin:18px auto 22px;display:inline-flex;gap:10px;padding:9px 14px;border-radius:99px;background:rgba(8,20,23,.6);border:1px solid var(--hair)}
.mini .cell{display:flex;flex-direction:column;line-height:1.1;padding:0 8px}
.mini .cell + .cell{border-left:1px solid var(--hair)}
.mini .k{font-family:var(--ff-plate);text-transform:uppercase;letter-spacing:.14em;font-size:9px;color:var(--text3);font-weight:700}
.mini .v{font-family:var(--ff-display);font-weight:800;font-size:18px;color:var(--text)}

.btn{display:flex;align-items:center;gap:12px;height:60px;border-radius:18px;padding:0 20px;margin-top:12px}
.btn .ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none}
.btn .lb{font-family:var(--ff-display);font-weight:800;font-size:17px;letter-spacing:.03em}
.btn.primary{background:linear-gradient(180deg,#FFDC8E,#F2A93B 42%,#C9861F);border:1px solid #7A4B12;box-shadow:0 12px 26px rgba(242,169,59,.38),inset 0 2px 0 rgba(255,255,255,.55)}
.btn.primary .lb{color:#3A2408;text-transform:uppercase;letter-spacing:.06em}
.btn.primary .ic{background:rgba(58,36,8,.85)}
.btn.primary .ic svg{fill:#FFCE7A}
.btn.ghost{background:rgba(23,65,74,.55);border:1px solid var(--hair)}
.btn.ghost .ic{background:rgba(8,20,23,.6)}
.btn.ghost .ic svg{stroke:#FFCE7A;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.btn.danger{background:rgba(66,26,16,.55);border:1px solid rgba(196,80,46,.4)}
.btn.danger .lb{color:#FFB98C}
.btn.danger .ic{background:rgba(30,12,8,.7)}
.btn.danger .ic svg{stroke:#FFB98C;stroke-width:2;fill:none;stroke-linecap:round}
</style>
</head>
<body>
<div class="screen">
  <div class="bg"></div>
  <svg width="0" height="0" aria-hidden="true"><defs>
    <radialGradient id="gBrass" cx="36%" cy="30%" r="80%"><stop offset="0" stop-color="#FFE7B4"/><stop offset=".40" stop-color="#F2A93B"/><stop offset=".78" stop-color="#B9761E"/><stop offset="1" stop-color="#6E430E"/></radialGradient>
    <radialGradient id="gSteel" cx="36%" cy="30%" r="80%"><stop offset="0" stop-color="#D4E8EA"/><stop offset=".5" stop-color="#7C9EA3"/><stop offset="1" stop-color="#274A50"/></radialGradient>
    <radialGradient id="gDark" cx="36%" cy="30%" r="80%"><stop offset="0" stop-color="#255057"/><stop offset="1" stop-color="#0C282D"/></radialGradient>
    <symbol id="cog" viewBox="0 0 120 120">
      <g><rect x="52.5" y="2" width="15" height="26" rx="3" transform="rotate(0 60 60)"/><rect x="52.5" y="2" width="15" height="26" rx="3" transform="rotate(30 60 60)"/><rect x="52.5" y="2" width="15" height="26" rx="3" transform="rotate(60 60 60)"/><rect x="52.5" y="2" width="15" height="26" rx="3" transform="rotate(90 60 60)"/><rect x="52.5" y="2" width="15" height="26" rx="3" transform="rotate(120 60 60)"/><rect x="52.5" y="2" width="15" height="26" rx="3" transform="rotate(150 60 60)"/><rect x="52.5" y="2" width="15" height="26" rx="3" transform="rotate(180 60 60)"/><rect x="52.5" y="2" width="15" height="26" rx="3" transform="rotate(210 60 60)"/><rect x="52.5" y="2" width="15" height="26" rx="3" transform="rotate(240 60 60)"/><rect x="52.5" y="2" width="15" height="26" rx="3" transform="rotate(270 60 60)"/><rect x="52.5" y="2" width="15" height="26" rx="3" transform="rotate(300 60 60)"/><rect x="52.5" y="2" width="15" height="26" rx="3" transform="rotate(330 60 60)"/><circle cx="60" cy="60" r="43"/></g>
      <circle cx="60" cy="60" r="31" fill="none" stroke="rgba(0,0,0,.16)" stroke-width="2"/>
      <g stroke="rgba(0,0,0,.2)" stroke-width="7" stroke-linecap="round" fill="none"><line x1="60" y1="24" x2="60" y2="96"/><line x1="24" y1="60" x2="96" y2="60"/><line x1="35" y1="35" x2="85" y2="85"/><line x1="85" y1="35" x2="35" y2="85"/></g>
      <circle cx="60" cy="60" r="16" fill="#0C2529"/><circle cx="60" cy="60" r="16" fill="none" stroke="rgba(0,0,0,.5)" stroke-width="2"/>
    </symbol>
  </defs></svg>

  <!-- dimmed machine behind -->
  <div class="behind">
    <svg class="gear" style="left:40px;top:300px;width:110px;height:110px" viewBox="0 0 120 120"><use href="#cog" fill="url(#gBrass)"/></svg>
    <svg class="gear" style="left:130px;top:250px;width:90px;height:90px" viewBox="0 0 120 120"><use href="#cog" fill="url(#gSteel)"/></svg>
    <svg class="gear" style="left:210px;top:210px;width:80px;height:80px" viewBox="0 0 120 120"><use href="#cog" fill="url(#gBrass)"/></svg>
    <svg class="gear" style="left:250px;top:520px;width:120px;height:120px" viewBox="0 0 120 120"><use href="#cog" fill="url(#gDark)"/></svg>
  </div>
  <div class="scrim"></div>

  <div class="card">
    <div class="seal">
      <svg class="big gear" viewBox="0 0 120 120"><use href="#cog" fill="url(#gBrass)"/></svg>
      <div class="pi"><b></b><b></b></div>
    </div>
    <div class="eyebrow">Bay 07 · Escapement Gate</div>
    <div class="h">Paused</div>
    <div class="sub">The mainspring holds. Catch your breath.</div>

    <div class="mini">
      <div class="cell"><span class="k">Score</span><span class="v">6,240</span></div>
      <div class="cell"><span class="k">Gears</span><span class="v">7</span></div>
      <div class="cell"><span class="k">Powered</span><span class="v">0:48</span></div>
    </div>

    <div class="btn primary"><span class="ic"><svg width="16" height="16" viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z"/></svg></span><span class="lb">Resume</span></div>
    <div class="btn ghost"><span class="ic"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 1 2.3 5.6M4 12V7m0 5h5"/></svg></span><span class="lb">Restart bay</span></div>
    <div class="btn danger"><span class="ic"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M6 6l12 12M6 12h.01M18 12h.01M12 4a8 8 0 1 0 0 16 8 8 0 0 0 0-16z"/></svg></span><span class="lb">Quit to Conduit</span></div>
  </div>

  <div class="grain"></div><div class="vig"></div>
</div>
</body>
</html>
